{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | MusicElo</title>
    <script>
        // Apply the saved theme before first paint to avoid a flash of the wrong theme.
        try {
            var theme = localStorage.getItem("theme");
            if (theme) document.documentElement.dataset.theme = theme;
        } catch (e) {}
    </script>
    <link rel="stylesheet" href="{% static 'songs/styles.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body{% block body_class %}{% endblock %}>
    {% block content %}{% endblock %}
    <div class="top-actions">
        {% if user.is_authenticated %}
            <a href="{% url 'songs:account' %}" class="icon-button" aria-label="Account" title="Account">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
                </svg>
            </a>
        {% endif %}
        <button type="button" class="icon-button theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
            <span class="icon-dark" aria-hidden="true">&#9790;</span>
            <span class="icon-light" aria-hidden="true">&#9728;</span>
        </button>
    </div>
    <script>
        document.querySelector(".theme-toggle").addEventListener("click", function () {
            var root = document.documentElement;
            var current = root.dataset.theme ||
                (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            var next = current === "dark" ? "light" : "dark";
            root.dataset.theme = next;
            try { localStorage.setItem("theme", next); } catch (e) {}
        });
    </script>
</body>
</html>
