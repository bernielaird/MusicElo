{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'songs/styles.css' %}">
    <link rel="stylesheet" href="{% static 'songs/index.css' %}">
    <link rel="icon" href="{% static 'images/foxv1.png' %}" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Log In{% endblock %}</title>
</head>
<body>
    <div class="home-card">
        <h1>Album Elo</h1>
        <p>Rate songs, compare matchups, and build your rankings.</p>

        {% if user.is_authenticated %}
            <div class="nav-links">
                <a href="/ratinglist/">Add a Song</a>
                <a href="/songlist/">Song List</a>
                <a href="/versus/">Start Versus</a>

                <form method="post" action="/logout/">
                    {% csrf_token %}
                    <button style="margin-top:10px;">Logout</button>
                </form>
            </div>
        {% else %}
            <div class="nav-links">
                <a href="/login/">Login</a>
                <a href="/signup/">Sign Up</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
