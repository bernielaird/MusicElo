{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static 'songs/styles.css' %}">
    <link rel="stylesheet" href="{% static 'songs/versus.css' %}">
    <link rel="icon" href="{% static 'images/foxv1.png' %}" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Song List{% endblock %}</title>
</head>

<div class="containerBox">
    <a href="/versus/{{ firstid }}/{{ secondid }}">
        <img src="{{ firstimage }}" class="image1">
    </a>
    <a href="/versus/{{ secondid }}/{{ firstid }}">
        <img src="{{ secondimage }}" class="image2">
    </a>
    <a class = "back" href="/">BACK</a>
    <div class = text>
        <div class = "first">
            <div>{{firstsong}}: </div>
            <div>{{ firstartist }}</div>
            <div>{{ firstscore }}</div>
        </div>
        <div class = "second">
            <div>{{ secondsong }}: </div>
            <div>{{ secondartist }}</div>
            <div>{{ secondscore }}</div>
        </div>
    </div>
    <div class = "firstembed">
        <iframe src="https://open.spotify.com/embed/track/{{ firsturi }}?utm_source=oembed" style="top: 0; left: 0; width: 100%; height: 100%; position: absolute; border: 0;" allowfullscreen allow="clipboard-write; encrypted-media; fullscreen; picture-in-picture;">
        </iframe>
    </div>

    <div class = "secondembed">
        <iframe src="https://open.spotify.com/embed/track/{{ seconduri }}?utm_source=oembed" style="top: 0; left: 0; width: 100%; height: 100%; position: absolute; border: 0;" allowfullscreen allow="clipboard-write; encrypted-media; fullscreen; picture-in-picture;">
        </iframe>
    </div>
</div>

<footer class="bottom-bar">
    <div class="bottom-left">
        <a href="/" class="name">Home</a>
        <a href="/ratinglist/">Add</a>
        <a href="/songlist/">List</a>
        <a href="/versus/">Versus</a>
    </div>
</footer>
